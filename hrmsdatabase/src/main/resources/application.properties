# ----------------------------------------
# H2 IN-MEMORY DATABASE PROPERTIES
# ----------------------------------------
# Points to a volatile in-memory database named 'testdb'
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=abes
spring.datasource.password=Aman@853385

# ----------------------------------------
# H2 WEB CONSOLE CONFIGURATION
# ----------------------------------------
# Enables the browser-based UI console
spring.h2.console.enabled=true
# Sets the path to access it (e.g., http://localhost:8080/h2-console)
spring.h2.console.path=/h2-console

# ----------------------------------------
# JPA / HIBERNATE CONFIGURATION
# ----------------------------------------
# Tells Hibernate how to translate Java commands to H2 SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Automatically creates/updates your database tables based on @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Optional: prints executed SQL commands to the console terminal
spring.jpa.show-sql=true